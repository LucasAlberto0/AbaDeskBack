name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore AbaDesk.sln

      - name: Build
        run: dotnet build AbaDesk.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/AbaDesk.UnitTests/AbaDesk.UnitTests.csproj --no-build --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/AbaDesk.IntegrationTests/AbaDesk.IntegrationTests.csproj --no-build --configuration Release --verbosity normal
